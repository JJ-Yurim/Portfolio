<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">까꿍 역할별 StateView 구조</title>
  <desc id="desc">서버 원본 게임 상태를 역할별 공개 정보로 필터링해 HUD와 미니맵에 전달하는 구조</desc>
  <rect width="1280" height="720" rx="34" fill="#0f1418"/>
  <text x="86" y="96" font-family="IBM Plex Sans KR, Arial, sans-serif" font-size="34" font-weight="800" fill="#f6f0d8">까꿍 · 역할별 StateView 구조</text>
  <text x="86" y="140" font-family="IBM Plex Sans KR, Arial, sans-serif" font-size="20" font-weight="500" fill="#b9c0bc">술래와 도망자에게 필요한 정보만 내려보내 미니맵 노출과 전송량을 줄였습니다.</text>
  <g font-family="IBM Plex Sans KR, Arial, sans-serif">
    <rect x="92" y="252" width="280" height="166" rx="28" fill="#171f25" stroke="#4c5a54"/>
    <text x="140" y="318" font-size="28" font-weight="800" fill="#f4cf65">GameState</text>
    <text x="140" y="360" font-size="18" fill="#cad2cf">players · maze · traps</text>
    <text x="140" y="390" font-size="18" fill="#cad2cf">sensors · exits · round</text>
    <path d="M392 335h122" stroke="#f4cf65" stroke-width="5" stroke-linecap="round"/>
    <path d="m498 317 26 18-26 18" fill="none" stroke="#f4cf65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="548" y="252" width="240" height="166" rx="28" fill="#1b272c" stroke="#5a685f"/>
    <text x="596" y="318" font-size="28" font-weight="800" fill="#e9f1de">View Filter</text>
    <text x="596" y="360" font-size="18" fill="#cad2cf">role · visibility</text>
    <text x="596" y="390" font-size="18" fill="#cad2cf">equipment scope</text>
    <path d="M788 305h110" stroke="#f4cf65" stroke-width="5" stroke-linecap="round"/>
    <path d="m882 287 26 18-26 18" fill="none" stroke="#f4cf65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M788 365h110" stroke="#7bd7ca" stroke-width="5" stroke-linecap="round"/>
    <path d="m882 347 26 18-26 18" fill="none" stroke="#7bd7ca" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="930" y="210" width="250" height="130" rx="26" fill="#202b25" stroke="#6a7341"/>
    <text x="986" y="265" font-size="26" font-weight="800" fill="#f4cf65">TaggerView</text>
    <text x="986" y="304" font-size="17" fill="#cad2cf">덫 · 감지기 · 추적 HUD</text>
    <rect x="930" y="384" width="250" height="130" rx="26" fill="#18292d" stroke="#42716c"/>
    <text x="982" y="439" font-size="26" font-weight="800" fill="#7bd7ca">RunnerView</text>
    <text x="982" y="478" font-size="17" fill="#cad2cf">지도 교환 · 탈출 정보</text>
    <rect x="214" y="512" width="852" height="82" rx="24" fill="#151c21" stroke="#3e4945"/>
    <text x="278" y="563" font-size="22" font-weight="800" fill="#f6f0d8">HUD / MiniMap / Equipment UI는 StateView만 읽어 렌더링</text>
  </g>
</svg>
