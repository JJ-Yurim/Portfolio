<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">까꿍 역할별 StateView 구조</title>
<desc id="desc">GameState에서 View Filter를 거쳐 TaggerView와 RunnerView로 분기되는 구조</desc>
<defs><marker id="arrow-neutral" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M3 2 8 6 3 10" fill="none" stroke="#819d96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-gold" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M3 2 8 6 3 10" fill="none" stroke="#d3ba72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-mint" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M3 2 8 6 3 10" fill="none" stroke="#80baad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1280" height="720" rx="24" fill="#131e23"/>
<g font-family="Arial, 'Malgun Gothic', sans-serif">
<text x="72" y="62" font-size="13" font-weight="700" fill="#82cdbf" letter-spacing="2">KKAKKUNG / STATE VIEW</text>
<text x="72" y="108" font-size="32" font-weight="700" fill="#f0f3f2" >역할에 필요한 정보만 전달</text>
<text x="72" y="148" font-size="20" font-weight="400" fill="#a7b5b1" >서버의 원본 상태를 역할별로 필터링해 각 플레이어의 화면에 전달합니다.</text>
<path d="M72 177H1208" stroke="#303f42"/>
<text x="72" y="216" font-size="15" font-weight="700" fill="#8b9f9a" >서버 원본</text>
<text x="448" y="216" font-size="15" font-weight="700" fill="#8b9f9a" >정보 필터링</text>
<text x="920" y="216" font-size="15" font-weight="700" fill="#8b9f9a" >역할별 화면</text>
<rect  x="72" y="280" width="280" height="188" rx="16" fill="#1c292e" stroke="#3b4d51"/>
<text x="100" y="324" font-size="28" font-weight="700" fill="#eef3f1" >GameState</text>
<text x="100" y="368" font-size="19" font-weight="400" fill="#b0beb9" >players · maze · traps</text>
<text x="100" y="400" font-size="19" font-weight="400" fill="#b0beb9" >sensors · exits · round</text>
<text x="100" y="441" font-size="15" font-weight="400" fill="#7e9991" >게임 전체 상태</text>
<rect  x="448" y="280" width="280" height="188" rx="16" fill="#1c292e" stroke="#3b4d51"/>
<text x="476" y="324" font-size="28" font-weight="700" fill="#eef3f1" >View Filter</text>
<text x="476" y="368" font-size="19" font-weight="400" fill="#b0beb9" >role · visibility</text>
<text x="476" y="400" font-size="19" font-weight="400" fill="#b0beb9" >equipment scope</text>
<text x="476" y="441" font-size="15" font-weight="400" fill="#7e9991" >역할과 공개 범위 적용</text>
<path  d="M360 374H438" fill="none" stroke="#819d96" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-neutral)"/>
<path  d="M736 346H810Q826 346 826 330V318Q826 302 842 302H910" fill="none" stroke="#d3ba72" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-gold)"/>
<path  d="M736 402H810Q826 402 826 418V462Q826 478 842 478H910" fill="none" stroke="#80baad" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-mint)"/>
<rect  x="920" y="234" width="288" height="136" rx="16" fill="#29312b" stroke="#575b40"/>
<text x="948" y="270" font-size="14" font-weight="700" fill="#b3a774" >술래에게 공개</text>
<text x="948" y="311" font-size="27" font-weight="700" fill="#e6d18f" >TaggerView</text>
<text x="948" y="343" font-size="18" font-weight="400" fill="#bec8bd" >덫 · 감지기 · 추적 HUD</text>
<rect  x="920" y="410" width="288" height="136" rx="16" fill="#1c3032" stroke="#395851"/>
<text x="948" y="446" font-size="14" font-weight="700" fill="#81b6a9" >도망자에게 공개</text>
<text x="948" y="487" font-size="27" font-weight="700" fill="#9ed6c7" >RunnerView</text>
<text x="948" y="519" font-size="18" font-weight="400" fill="#bacac5" >지도 교환 · 탈출 정보</text>
<rect  x="72" y="594" width="1136" height="68" rx="16" fill="#1a272b" stroke="#304248"/>
<text x="100" y="637" font-size="15" font-weight="700" fill="#82cdbf" >화면 렌더링</text>
<text x="248" y="637" font-size="20" font-weight="400" fill="#d2ddda" >HUD · MiniMap · Equipment UI는 필터링된 StateView만 읽습니다.</text>
</g>
</svg>
