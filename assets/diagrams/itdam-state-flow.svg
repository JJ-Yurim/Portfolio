<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">잇담 문장 저장 상태 구조</title>
<desc id="desc">입력, 저장 요청, 확정 결과, 평가, 보관의 흐름과 별도 대기 초안 상태</desc>
<defs><marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M3 2 8 6 3 10" fill="none" stroke="#9584bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1280" height="720" rx="24" fill="#faf9fd"/>
<g font-family="Arial, 'Malgun Gothic', sans-serif">
<text x="72" y="62" font-size="13" font-weight="700" fill="#7760ac" letter-spacing="2">ITDAM / SAVE STATE</text>
<text x="72" y="108" font-size="32" font-weight="700" fill="#30253f" >마지막 입력까지, 안전하게 저장</text>
<text x="72" y="148" font-size="20" font-weight="400" fill="#626577" >입력과 저장 결과를 분리하고, 저장 도중의 변경은 대기 초안으로 보관합니다.</text>
<path d="M72 177H1208" stroke="#e3deec"/>
<text x="72" y="216" font-size="15" font-weight="700" fill="#7760ac" >문장 저장과 활용</text>
<rect data-state="draftInput" x="72" y="238" width="192" height="164" rx="16" fill="#fff" stroke="#ded8e8"/>
<text x="92" y="268" font-size="13" font-weight="700" fill="#8a7c9e" >01 / 입력</text>
<text x="92" y="305" font-size="20" font-weight="700" fill="#493469" >draftInput</text>
<text x="92" y="343" font-size="18" font-weight="400" fill="#626577" >현재 작성 중인</text>
<text x="92" y="371" font-size="18" font-weight="400" fill="#626577" >문장 입력값</text>
<path  d="M272 320H300" fill="none" stroke="#9584bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect data-state="isSaving" x="308" y="238" width="192" height="164" rx="16" fill="#fff" stroke="#ded8e8"/>
<text x="328" y="268" font-size="13" font-weight="700" fill="#8a7c9e" >02 / 저장 요청</text>
<text x="328" y="305" font-size="20" font-weight="700" fill="#493469" >isSaving</text>
<text x="328" y="343" font-size="18" font-weight="400" fill="#626577" >현재 요청의</text>
<text x="328" y="371" font-size="18" font-weight="400" fill="#626577" >진행 여부 확인</text>
<path  d="M508 320H536" fill="none" stroke="#9584bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect data-state="savedVersion" x="544" y="238" width="192" height="164" rx="16" fill="#fff" stroke="#ded8e8"/>
<text x="564" y="268" font-size="13" font-weight="700" fill="#8a7c9e" >03 / 저장 완료</text>
<text x="564" y="305" font-size="20" font-weight="700" fill="#493469" >savedVersion</text>
<text x="564" y="343" font-size="18" font-weight="400" fill="#626577" >서버에 확정된</text>
<text x="564" y="371" font-size="18" font-weight="400" fill="#626577" >최신 문장</text>
<path  d="M744 320H772" fill="none" stroke="#9584bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect data-state="AI Review" x="780" y="238" width="192" height="164" rx="16" fill="#fff" stroke="#ded8e8"/>
<text x="800" y="268" font-size="13" font-weight="700" fill="#8a7c9e" >04 / 평가</text>
<text x="800" y="305" font-size="20" font-weight="700" fill="#493469" >AI Review</text>
<text x="800" y="343" font-size="18" font-weight="400" fill="#626577" >AI 평가 결과와</text>
<text x="800" y="371" font-size="18" font-weight="400" fill="#626577" >레이드 참여 조건</text>
<path  d="M980 320H1008" fill="none" stroke="#9584bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<rect data-state="Library" x="1016" y="238" width="192" height="164" rx="16" fill="#fff" stroke="#ded8e8"/>
<text x="1036" y="268" font-size="13" font-weight="700" fill="#8a7c9e" >05 / 보관</text>
<text x="1036" y="305" font-size="20" font-weight="700" fill="#493469" >Library</text>
<text x="1036" y="343" font-size="18" font-weight="400" fill="#626577" >개인·공동 책과</text>
<text x="1036" y="371" font-size="18" font-weight="400" fill="#626577" >보관함으로 연결</text>
<g id="pending-flow">
<path stroke-dasharray="10 10" d="M370 410V470" fill="none" stroke="#9584bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<path stroke-dasharray="10 10" d="M438 470V412" fill="none" stroke="#9584bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-purple)"/>
<text x="352" y="449" font-size="14" font-weight="400" fill="#827193" text-anchor="end">새 입력</text>
<text x="455" y="449" font-size="14" font-weight="400" fill="#827193" >재저장</text>
<rect data-state="pendingDraft" x="308" y="478" width="192" height="128" rx="16" fill="#f0ebf8" stroke="#d4c7e6"/>
<text x="328" y="509" font-size="13" font-weight="700" fill="#827193" >저장 중 변경된 입력</text>
<text x="328" y="545" font-size="20" font-weight="700" fill="#493469" >pendingDraft</text>
<text x="328" y="580" font-size="16" font-weight="400" fill="#626577" >최신 초안 임시 보관</text>
<path d="M544 486V598" stroke="#d8cfe5" stroke-width="2"/>
<text x="568" y="511" font-size="18" font-weight="700" fill="#493469" >저장 요청이 겹치면</text>
<text x="568" y="550" font-size="18" font-weight="400" fill="#626577" data-note-line="1">저장 중 새 입력은 대기 초안으로 보관합니다.</text>
<text x="568" y="580" font-size="18" font-weight="400" fill="#626577" data-note-line="2">현재 요청이 끝나면 최신 값으로 한 번 더 저장합니다.</text>
</g>
<path d="M72 650H1208" stroke="#e3deec"/>
<text x="72" y="683" font-size="14" font-weight="700" fill="#7760ac" >핵심 설계</text>
<text x="168" y="683" font-size="17" font-weight="400" fill="#626577" >자동 저장과 수동 저장이 겹쳐도 마지막 문장을 잃지 않도록 상태를 분리했습니다.</text>
</g>
</svg>
