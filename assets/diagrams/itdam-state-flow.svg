    <path d="m773 283 26 18-26 18" fill="none" stroke="#8a6cff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="818" y="232" width="210" height="138" rx="24" fill="#ffffff" stroke="#d8d0ea"/>
    <text x="858" y="286" font-size="23" font-weight="800" fill="#4c2eb8">pendingDraft</text>
