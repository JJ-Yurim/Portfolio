<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">잇담 저장 상태 구조</title>
  <desc id="desc">작성 입력, 저장 중 상태, 대기 초안, 서버 반영 결과를 분리한 상태 흐름</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fbf8ff"/>
      <stop offset="1" stop-color="#f2f0ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#6750a4" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1280" height="720" rx="34" fill="url(#bg)"/>
  <text x="86" y="96" font-family="IBM Plex Sans KR, Arial, sans-serif" font-size="34" font-weight="800" fill="#332a46">잇담 · 문장 저장 상태 구조</text>
  <text x="86" y="140" font-family="IBM Plex Sans KR, Arial, sans-serif" font-size="20" font-weight="500" fill="#6b6478">자동 저장과 수동 저장이 겹쳐도 마지막 입력을 잃지 않도록 상태를 분리했습니다.</text>
