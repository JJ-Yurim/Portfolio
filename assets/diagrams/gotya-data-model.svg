<rect  x="960" y="337" width="248" height="80" rx="16" fill="#fff" stroke="#d5e4e1"/>
<text x="988" y="387" font-size="24" font-weight="700" fill="#355955" >Book</text>
<rect  x="960" y="480" width="248" height="80" rx="16" fill="#fff" stroke="#d5e4e1"/>
<text x="988" y="530" font-size="24" font-weight="700" fill="#355955" >Culture</text>
<path  d="M628 470V514" fill="none" stroke="#6f9e93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<rect  x="456" y="524" width="344" height="86" rx="16" fill="#fff" stroke="#c7deda"/>
<text x="484" y="560" font-size="24" font-weight="700" fill="#2e7167" >Recommendation</text>
<text x="484" y="590" font-size="17" font-weight="400" fill="#626577" >공통 모델 기반 추천</text>
<path d="M72 650H1208" stroke="#dbe7e5"/>
<text x="72" y="683" font-size="14" font-weight="700" fill="#3a827c" >핵심 설계</text>
<text x="168" y="683" font-size="17" font-weight="400" fill="#626577" >콘텐츠마다 다른 상세 정보는 분리하고, 추천과 사용자 반응은 공통 모델로 처리합니다.</text>
