<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
<title id="title">GotYA 콘텐츠 데이터 모델</title>
<desc id="desc">취향과 사용자 반응이 공통 콘텐츠 모델에 연결되고 영화 도서 문화 및 추천으로 확장되는 구조</desc>
<defs><marker id="arrow-teal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M3 2 8 6 3 10" fill="none" stroke="#6f9e93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="1280" height="720" rx="24" fill="#f6faf9"/>
<g font-family="Arial, 'Malgun Gothic', sans-serif">
<text x="72" y="62" font-size="13" font-weight="700" fill="#3a827c" letter-spacing="2">GOTYA / CONTENT MODEL</text>
<text x="72" y="108" font-size="32" font-weight="700" fill="#233e42" >다른 콘텐츠를 하나의 기준으로</text>
<text x="72" y="148" font-size="20" font-weight="400" fill="#626577" >영화·도서·문화생활을 ContentItem으로 연결해 추천과 사용자 반응을 함께 다룹니다.</text>
<path d="M72 177H1208" stroke="#dbe7e5"/>
<text x="72" y="208" font-size="15" font-weight="700" fill="#748985" >취향과 사용자 반응</text>
<text x="456" y="208" font-size="15" font-weight="700" fill="#748985" >공통 콘텐츠 모델</text>
<text x="960" y="208" font-size="15" font-weight="700" fill="#748985" >콘텐츠 유형</text>
<rect  x="72" y="238" width="248" height="120" rx="16" fill="#fff" stroke="#d5e4e1"/>
<text x="96" y="283" font-size="25" font-weight="700" fill="#355955" >TasteResult</text>
<text x="96" y="324" font-size="19" font-weight="400" fill="#626577" >취향 테스트 결과</text>
<rect  x="72" y="418" width="248" height="120" rx="16" fill="#fff" stroke="#d5e4e1"/>
<text x="96" y="463" font-size="25" font-weight="700" fill="#355955" >User Action</text>
<text x="96" y="504" font-size="19" font-weight="400" fill="#626577" >찜 · 좋아요 · 후기</text>
<rect  x="456" y="292" width="344" height="170" rx="16" fill="#eef7f5" stroke="#afcec7"/>
<text x="484" y="332" font-size="13" font-weight="700" fill="#588a80" >공통 기준</text>
<text x="484" y="374" font-size="30" font-weight="700" fill="#2e7167" >ContentItem</text>
<text x="484" y="417" font-size="18" font-weight="400" fill="#626577" >title · thumbnail · type · score</text>
<path  d="M328 298H384Q400 298 400 314V320Q400 336 416 336H446" fill="none" stroke="#6f9e93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path id="action-to-content" d="M328 478H384Q400 478 400 462V432Q400 416 416 416H446" fill="none" stroke="#6f9e93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
<path  d="M808 322H852Q868 322 868 306V280Q868 264 884 264H950" fill="none" stroke="#6f9e93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow-teal)"/>
